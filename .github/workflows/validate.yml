name: Validate partial snapshot
on: [push, pull_request]
jobs:
  validate-data-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q scripts
      - run: python scripts/verify_bundled_data.py
